<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{URL}}" />
    <meta property="og:title" content="{{TITLE}}" />

    <meta name="twitter:card" content="summary_large_image">
    <meta property="og:image" content="{{PREVIEWRL}}" />
    <meta name="twitter:image" content="{{PREVIEWRL}}" />
    <meta property="og:image:width" content="1920" />
    <meta property="og:image:height" content="1080" />

    <meta property="og:description" content="{{DESCRIPTION}}" />

    <title>{{TITLE}}</title>
    <style>
        /* light mode */
        :root {
            --bg-color: #fdfdfc;
            --text-color: #2a2a2a;
            --grey: #777777;
            --accent-1: #8b0000;
        }

        /* dark mode */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #1a1a1a;
                --text-color: #e0e0e0;
                --meta-color: #999999;
                --accent-color: #ff6b6b;
            }
        }

        body {
            font-family: "Georgia", "Times New Roman", serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.8;
            margin: 0;
            padding: 20px;
            font-size: 18px;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
            padding: 40px 20px 80px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 4em;
            border-bottom: 1px solid var(--accent-1);
            padding-bottom: 2em;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 0.2em;
            letter-spacing: -0.02em;
        }

        .metadata {
            color: var(--grey);
            font-style: italic;
            font-size: 0.9em;
        }

        .content p {
            margin-bottom: 0;
            text-indent: 2em;
        }

        .content p:first-of-type,
        .content h2+p,
        .content h3+p,
        .content hr+p {
            text-indent: 0;
            margin-top: 1.5em;
        }

        .content hr {
            border: 0;
            text-align: center;
            margin: 3em 0;
        }

        .content hr::before {
            content: "***";
            font-size: 1.5em;
            letter-spacing: 0.5em;
            color: var(--accent-1);
        }

        .smallcaps {
            font-variant: small-caps;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>{{TITLE}}</h1>
            <div class="metadata">By {{AUTHOR}} &bull; {{DATE}}</div>
        </header>
        <main class="content">
            {{CONTENT}}
        </main>
    </div>
</body>

</html>
